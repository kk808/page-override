<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Local Test Pages</title>
    <style>
      :root { color-scheme: dark; }
      body { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 32px 24px 96px; background: #0f1218; color: #e6e9ef; }
      #tables { display: grid; gap: 16px; align-items: start; width: 100%; }
      table { table-layout: fixed; }
      table.draggable-group { cursor: grab; transition: opacity .15s, outline-color .15s; }
      table.draggable-group:active { cursor: grabbing; }
      table.dragging { opacity: .45; }
      table.drop-before { outline: 2px solid #5b8def; outline-offset: -2px; }
      td:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      td:first-child a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
      .bar { position: relative; margin: 0 0 8px; }
      #filter { width: 100%; box-sizing: border-box; padding-right: 70px; font: inherit; padding: 9px 12px; color: inherit; background: #181c25; border: 1px solid #2a3040; border-radius: 10px; outline: none; transition: border-color .15s, box-shadow .15s; }
      #filter::placeholder { color: #6b7385; }
      #filter:focus { border-color: #5b8def; box-shadow: 0 0 0 3px rgba(91, 141, 239, .25); }
      .bar.hidden { display: none; }
      .th-inner { display: grid; grid-template-columns: 24px 1fr 24px; align-items: center; gap: 8px; }
      .th-inner span { grid-column: 2; text-align: center; }
      .th-inner .filter-btn { grid-column: 3; }
      th .filter-btn { width: 24px; height: 24px; color: #5f6677; }
      th .filter-btn:hover { color: #8b93a7; }
      #count { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #8b93a7; pointer-events: none; }
      button { font: inherit; width: 22px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; color: #5f6677; background: transparent; border: none; border-radius: 6px; cursor: pointer; transition: background .15s, color .15s; }
      button:hover { background: rgba(255, 255, 255, .08); color: #8b93a7; }
      tbody tr.armed td, tbody tr.armed:hover td { background: rgba(255, 90, 90, .18); }
      tbody tr.armed button, tbody tr.armed button:hover { font-weight: 900; color: #ff4d4d; background: transparent; }
      table { width: 100%; border-collapse: separate; border-spacing: 0; background: #151922; border: 1px solid #232938; border-radius: 12px; overflow: hidden; }
      th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #232938; vertical-align: middle; }
      th { font-size: 16px; font-weight: 700; letter-spacing: .04em; color: #e6e9ef; background: #1a1f2b; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover td { background: #1b2130; }
      td:last-child { text-align: right; padding-left: 0; padding-right: 8px; }
      .row-actions { display: flex; justify-content: flex-end; gap: 2px; }
      td:first-child { padding-right: 4px; }
      a { color: #7aa7ff; text-decoration: none; }
      a:hover { color: #a9c4ff; text-decoration: underline; }
      #status { margin: 0 0 8px; color: #8b93a7; }
      #status:empty { display: none; }
      #actions { position: fixed; left: 24px; right: 24px; bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
      #actions button { width: auto; height: auto; padding: 11px 24px; font-size: 15px; font-weight: 600; letter-spacing: .02em; border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .45); }
      #reset { color: #ff8a8a; background: #2a1a1e; border: 1px solid #a8434b; }
      #reset:hover { background: #3a2026; color: #ffb0b0; border-color: #d9575f; }
      #reset.armed, #reset.armed:hover { background: #d93a3a; border-color: #ff6b6b; color: #fff; font-weight: 700; }
      #update { color: #7be0a0; background: #14301f; border: 1px solid #2f8f55; }
      #update:hover { background: #1b4128; color: #a6f0c0; border-color: #3fb46c; }
      #update.armed, #update.armed:hover { background: #22a455; border-color: #52d887; color: #fff; font-weight: 700; }
      #update:disabled { opacity: .6; cursor: default; }
      #progress { display: none; position: fixed; left: 50%; transform: translateX(-50%); width: 50vw; bottom: 28px; align-items: center; gap: 10px; font-size: 13px; color: #8b93a7; opacity: 1; transition: opacity .8s ease; }
      #progress.fading { opacity: 0; }
      #check { display: none; flex: none; }
      #progress.done #check { display: block; }
      #check circle { fill: none; stroke: #2fb463; stroke-width: 2; stroke-dasharray: 63; stroke-dashoffset: 63; }
      #check path { fill: none; stroke: #52d887; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
      #progress.done #check circle { animation: check-draw .5s ease forwards; }
      #progress.done #check path { animation: check-draw .35s .4s ease forwards; }
      @keyframes check-draw { to { stroke-dashoffset: 0; } }
      #progress.active { display: flex; }
      #progress progress { flex: 1; height: 10px; accent-color: #2fb463; }
    </style>
  </head>
  <body>
    <div class="bar hidden">
      <input id="filter" placeholder="Filter">
      <span id="count"></span>
    </div>
    <p id="status"></p>
    <div id="tables"></div>
    <div id="progress"><progress id="progressBar" value="0" max="1"></progress><svg id="check" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 8.8"/></svg><span id="progressText"></span></div>
    <div id="actions">
      <button id="reset" type="button">Delete All</button>
      <button id="update" type="button">Update All</button>
    </div>
    <script>
      const EXTENSION_ID = "__EXTENSION_ID__";
      const tables = document.getElementById("tables");
      const resetBtn = document.getElementById("reset");
      const updateBtn = document.getElementById("update");
      const progressEl = document.getElementById("progress");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const bar = document.querySelector(".bar");
      const statusEl = document.getElementById("status");
      const filterEl = document.getElementById("filter");
      let entries = [];
      let dir = null;
      let armedRow = null;
      let resetArmed = false;
      let updateArmed = false;
      let updating = false;
      const GROUP_ORDER_KEY = "page-override-group-order";
      let groupOrder = [];
      let draggedGroup = "";

      function tripTypeKey(entry) {
        return entry.tripType || "Unknown";
      }

      function allGroups() {
        const available = Array.from(new Set(entries.map(tripTypeKey)));
        return [...new Set([...groupOrder.filter((group) => available.includes(group)), ...available])];
      }

      function restoreGroupOrder() {
        try {
          const stored = JSON.parse(localStorage.getItem(GROUP_ORDER_KEY) || "[]");
          if (Array.isArray(stored) && stored.every((group) => typeof group === "string")) groupOrder = stored;
        } catch (err) {
          statusEl.textContent = "Could not restore table order: " + err.message;
        }
      }

      function retainGroupOrder() {
        try {
          localStorage.setItem(GROUP_ORDER_KEY, JSON.stringify(groupOrder));
        } catch (err) {
          statusEl.textContent = "Could not save table order: " + err.message;
        }
      }

      function disarm() {
        if (armedRow) armedRow.classList.remove("armed");
        armedRow = null;
        if (resetArmed) resetBtn.classList.remove("armed");
        resetArmed = false;
        if (updateArmed) updateBtn.classList.remove("armed");
        updateArmed = false;
      }
      // Clicking anywhere else, or pressing Esc, cancels a pending delete.
      document.addEventListener("click", disarm);
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") disarm(); });

      async function load() {
        try {
          const res = await fetch("index.json", { cache: "no-store" });
          entries = res.ok ? await res.json() : [];
        } catch { entries = []; }
        render();
      }

      function render() {
        const q = filterEl.value.trim().toLowerCase();
        const shown = entries
          .filter((e) => !q || (e.name + " " + (e.tripType || "")).toLowerCase().includes(q));
        document.getElementById("count").textContent = shown.length + "/" + entries.length;
        tables.textContent = "";
        // One table per TripType (up to 4), laid out side by side across the full viewport width.
        const groups = new Map();
        for (const e of shown) {
          const key = tripTypeKey(e);
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(e);
        }
        const orderedGroups = allGroups()
          .filter((group) => groups.has(group))
          .map((group) => [group, groups.get(group)]);
        tables.style.gridTemplateColumns = "repeat(" + Math.max(groups.size, 1) + ", minmax(0, 1fr))";
        for (const [tripType, items] of orderedGroups) {
          const table = document.createElement("table");
          table.className = "draggable-group";
          table.draggable = true;
          table.dataset.group = tripType;
          table.title = "Drag to rearrange";
          table.ondragstart = (event) => {
            draggedGroup = tripType;
            table.classList.add("dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", tripType);
          };
          table.ondragend = () => {
            draggedGroup = "";
            table.classList.remove("dragging");
            tables.querySelectorAll(".drop-before").forEach((item) => item.classList.remove("drop-before"));
          };
          table.ondragover = (event) => {
            if (!draggedGroup || draggedGroup === tripType) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            table.classList.add("drop-before");
          };
          table.ondragleave = () => table.classList.remove("drop-before");
          table.ondrop = (event) => {
            event.preventDefault();
            table.classList.remove("drop-before");
            if (!draggedGroup || draggedGroup === tripType) return;
            const order = allGroups();
            order.splice(order.indexOf(draggedGroup), 1);
            const target = order.indexOf(tripType);
            const insertAfter = event.clientX > table.getBoundingClientRect().left + table.offsetWidth / 2;
            order.splice(target + (insertAfter ? 1 : 0), 0, draggedGroup);
            groupOrder = order;
            retainGroupOrder();
            render();
          };
          const head = document.createElement("thead");
          const headRow = document.createElement("tr");
          const th = document.createElement("th");
          th.colSpan = 2;
          const title = document.createElement("span");
          title.textContent = tripType + " (" + items.length + ")";
          const filterBtn = document.createElement("button");
          filterBtn.className = "filter-btn";
          filterBtn.title = "Filter";
          filterBtn.setAttribute("aria-label", "Filter");
          filterBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z"/></svg>';
          filterBtn.onclick = (event) => {
            event.stopPropagation();
            bar.classList.toggle("hidden");
            if (bar.classList.contains("hidden")) { filterEl.value = ""; render(); }
            else filterEl.focus();
          };
          const headInner = document.createElement("div");
          headInner.className = "th-inner";
          headInner.append(title, filterBtn);
          th.append(headInner);
          headRow.append(th);
          head.append(headRow);
          const body = document.createElement("tbody");
          const cols = document.createElement("colgroup");
          const pageCol = document.createElement("col");
          const actionCol = document.createElement("col");
          actionCol.style.width = "56px";
          cols.append(pageCol, actionCol);
          table.append(cols, head, body);
          for (const e of items) {
            const tr = document.createElement("tr");
            const a = document.createElement("a");
            a.href = encodeURIComponent(e.name);
            let label = e.name.replace(/^SearchFight-/, "").replace(/\.html$/, "");
            // The TripType is the table heading, so drop it from the start of the label.
            if (e.tripType && label.startsWith(e.tripType + "-")) label = label.slice(e.tripType.length + 1);
            a.textContent = label;
            a.title = label;
            const linkCell = document.createElement("td");
            linkCell.append(a);
            const rename = document.createElement("button");
            rename.textContent = "✎";
            rename.title = "Rename";
            rename.draggable = false;
            rename.setAttribute("aria-label", "Rename " + e.name);
            rename.onclick = (event) => {
              event.stopPropagation();
              renamePage(e);
            };
            const del = document.createElement("button");
            del.textContent = "✕";
            del.title = "Delete";
            del.draggable = false;
            del.setAttribute("aria-label", "Delete " + e.name);
            del.onclick = (event) => {
              event.stopPropagation();
              // First click arms the row; a second click on the same minus deletes it.
              if (armedRow === tr) { disarm(); remove(e); return; }
              disarm();
              armedRow = tr;
              tr.classList.add("armed");
            };
            const actionCell = document.createElement("td");
            const actions = document.createElement("div");
            actions.className = "row-actions";
            actions.append(rename, del);
            actionCell.append(actions);
            tr.append(linkCell, actionCell);
            body.append(tr);
          }
          tables.append(table);
        }
      }

      // The folder handle is remembered in this origin's IndexedDB so it only has to be picked once.
      function idb(mode, action) {
        return new Promise((resolve, reject) => {
          const open = indexedDB.open("page-override-index", 1);
          open.onupgradeneeded = () => open.result.createObjectStore("kv");
          open.onerror = () => reject(open.error);
          open.onsuccess = () => {
            const db = open.result;
            const req = action(db.transaction("kv", mode).objectStore("kv"));
            req.onsuccess = () => { db.close(); resolve(req.result); };
            req.onerror = () => { db.close(); reject(req.error); };
          };
        });
      }

      async function restoreDir() {
        try {
          dir = (await idb("readonly", (s) => s.get("dir"))) || null;
          if (dir) statusEl.textContent = "";
        } catch { dir = null; }
      }

      async function ensureWritableDir() {
        await restored;
        if (!dir) {
          // First delete/reset only: ask for the destination folder, then remember it.
          dir = await window.showDirectoryPicker({ id: "page-override-index", mode: "readwrite" });
          await idb("readwrite", (s) => s.put(dir, "dir"));
        }
        if (await dir.queryPermission({ mode: "readwrite" }) !== "granted" &&
            await dir.requestPermission({ mode: "readwrite" }) !== "granted") {
          statusEl.textContent = "Folder access was not granted.";
          return false;
        }
        return true;
      }

      async function remove(entry) {
        try {
          if (!(await ensureWritableDir())) return;
          await dir.removeEntry(entry.name).catch((err) => { if (err.name !== "NotFoundError") throw err; });
          entries = entries.filter((e) => e.name !== entry.name);
          const w = await (await dir.getFileHandle("index.json", { create: true })).createWritable();
          await w.write(JSON.stringify(entries, null, 2));
          await w.close();
          statusEl.textContent = "";
          render();
        } catch (err) { if (err.name !== "AbortError") statusEl.textContent = "Delete failed: " + err.message; }
      }

      async function renamePage(entry) {
        const requested = window.prompt("New file name", entry.name);
        if (requested === null) return;
        let newName = requested.trim();
        if (newName && !/\.html$/i.test(newName)) newName += ".html";
        if (!newName || !/^[^/\\]+\.html$/i.test(newName) || newName.toLowerCase() === "index.html") {
          statusEl.textContent = "Rename failed: Use a valid .html file name.";
          return;
        }
        if (newName === entry.name) return;
        if (entries.some((item) => item.name.toLowerCase() === newName.toLowerCase())) {
          statusEl.textContent = "Rename failed: A saved page already uses that name.";
          return;
        }

        const originalEntries = entries;
        let copied = false;
        let indexUpdated = false;
        let indexRolledBack = false;
        try {
          if (!(await ensureWritableDir())) return;
          try {
            await dir.getFileHandle(newName);
            throw new Error("A file with that name already exists.");
          } catch (err) {
            if (err.name !== "NotFoundError" && err.message !== "A file with that name already exists.") throw err;
            if (err.message === "A file with that name already exists.") throw err;
          }
          const source = await (await (await dir.getFileHandle(entry.name)).getFile()).text();
          const writer = await (await dir.getFileHandle(newName, { create: true })).createWritable();
          try { await writer.write(source); await writer.close(); copied = true; }
          catch (err) { await writer.abort().catch(() => {}); throw err; }

          entries = entries.map((item) => item.name === entry.name ? { ...item, name: newName } : item);
          const indexWriter = await (await dir.getFileHandle("index.json", { create: true })).createWritable();
          try {
            await indexWriter.write(JSON.stringify(entries, null, 2));
            await indexWriter.close();
            indexUpdated = true;
          } catch (err) {
            await indexWriter.abort().catch(() => {});
            throw err;
          }
          await dir.removeEntry(entry.name).catch((err) => { if (err.name !== "NotFoundError") throw err; });
          statusEl.textContent = "";
          render();
        } catch (err) {
          entries = originalEntries;
          if (indexUpdated) {
            try {
              const rollback = await (await dir.getFileHandle("index.json", { create: true })).createWritable();
              await rollback.write(JSON.stringify(originalEntries, null, 2));
              await rollback.close();
              indexRolledBack = true;
            } catch { /* Keep the original file and expose the rename error below. */ }
          }
          if (copied && (!indexUpdated || indexRolledBack)) {
            await dir.removeEntry(newName).catch(() => {});
          }
          render();
          if (err.name !== "AbortError") statusEl.textContent = "Rename failed: " + err.message;
        }
      }

      async function resetAll() {
        try {
          if (!(await ensureWritableDir())) return;
          const names = new Set(entries.map((e) => e.name));
          try {
            const file = await (await dir.getFileHandle("index.json")).getFile();
            const onDisk = JSON.parse(await file.text());
            if (Array.isArray(onDisk)) for (const e of onDisk) if (e?.name) names.add(e.name);
          } catch { /* ignore missing or unreadable index.json */ }
          names.delete("index.html");
          names.delete("index.json");
          await Promise.all(Array.from(names, (name) =>
            dir.removeEntry(name).catch((err) => { if (err.name !== "NotFoundError") throw err; })
          ));
          entries = [];
          const w = await (await dir.getFileHandle("index.json", { create: true })).createWritable();
          await w.write("[]\n");
          await w.close();
          statusEl.textContent = "";
          render();
        } catch (err) { if (err.name !== "AbortError") statusEl.textContent = "Reset failed: " + err.message; }
      }

      function fetchUpdated(entry, snapshot) {
        return new Promise((resolve, reject) => {
          if (!window.chrome?.runtime?.sendMessage || EXTENSION_ID.startsWith("__")) {
            reject(new Error("Page Override extension is not reachable. Save a page once to refresh this index."));
            return;
          }
          chrome.runtime.sendMessage(EXTENSION_ID, { type: "fetchUpdatedPage", name: entry.name, url: entry.url, snapshot }, (reply) => {
            if (chrome.runtime.lastError) reject(new Error(chrome.runtime.lastError.message));
            else if (!reply || reply.error) reject(new Error(reply?.error || "No response from extension."));
            else resolve(reply.html);
          });
        });
      }

      async function updateAll() {
        const updateList = entries.filter((entry) => entry.tripType !== "Other");
        if (updating || !updateList.length) return;
        updating = true;
        updateBtn.disabled = true;
        resetBtn.disabled = true;
        const failures = [];
        try {
          if (!(await ensureWritableDir())) return;
          progressEl.classList.remove("done", "fading");
          progressEl.classList.add("active");
          progressBar.max = updateList.length;
          progressBar.value = 0;
          statusEl.textContent = "";
          for (let i = 0; i < updateList.length; i++) {
            const entry = updateList[i];
            progressText.textContent = "Updating " + (i + 1) + " of " + updateList.length + "…";
            try {
              let snapshot;
              if (!entry.url) snapshot = await (await (await dir.getFileHandle(entry.name)).getFile()).text();
              const html = await fetchUpdated(entry, snapshot);
              const w = await (await dir.getFileHandle(entry.name, { create: true })).createWritable();
              try { await w.write(html); await w.close(); }
              catch (err) { await w.abort().catch(() => {}); throw err; }
            } catch (err) { failures.push(entry.name + ": " + err.message); }
            progressBar.value = i + 1;
          }
          progressText.textContent = "Updated " + (updateList.length - failures.length) + " of " + updateList.length;
          progressEl.classList.add("done");
          if (failures.length) statusEl.textContent = "Some pages failed: " + failures.join(" | ");
        } catch (err) {
          if (err.name !== "AbortError") statusEl.textContent = "Update failed: " + err.message;
          progressEl.classList.remove("active");
        } finally {
          updating = false;
          updateBtn.disabled = false;
          resetBtn.disabled = false;
        }
      }

      resetBtn.onclick = (event) => {
        event.stopPropagation();
        if (resetArmed) { disarm(); resetAll(); return; }
        disarm();
        resetArmed = true;
        resetBtn.classList.add("armed");
      };

      updateBtn.onclick = (event) => {
        event.stopPropagation();
        if (updateArmed) { disarm(); updateAll(); return; }
        disarm();
        updateArmed = true;
        updateBtn.classList.add("armed");
      };

      filterEl.oninput = render;
      const restored = restoreDir();
      restoreGroupOrder();
      load();
    </script>
  </body>
</html>
