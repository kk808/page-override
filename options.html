<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page Override – Folders</title>
    <script src="options.js" defer></script>
    <style>
      body { font: 16px "Segoe UI", sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #243c35; }
      .row { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
      .row span { flex: 1; }
      button { font: inherit; padding: 8px 14px; border: 1px solid #65744e; border-radius: 8px; background: #d6e7a8; cursor: pointer; }
      #status { min-height: 1.5em; color: #555; }
    </style>
  </head>
  <body>
    <h1>Page Override Settings</h1>
    <p>Click the extension icon to move the newest completed file from the source folder to the destination folder and open it at localhost.</p>
    <div class="row"><span id="source-name">Source: not set</span><button id="source" type="button">Choose source</button></div>
    <div class="row"><span id="destination-name">Destination: not set</span><button id="destination" type="button">Choose destination</button></div>
    <div class="row"><button id="clear" type="button">Clear folders</button></div>
    <p id="status"></p>
  </body>
</html>
